[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadow-it-tracker-api"
version = "0.1.0"
description = "FastAPI foundation for the Autonomous Shadow IT Tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
